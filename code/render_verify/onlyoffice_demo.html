<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>银行函证 制函演示 - Excel 直填 + OnlyOffice</title>
    <script src="http://113.201.2.61:14002/onlyoffice/web-apps/apps/api/documents/api.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; overflow: hidden; }
        #topbar { height: 44px; background: #534AB7; color: #fff; display: flex; align-items: center; padding: 0 16px; }
        #topbar .title { font-size: 15px; font-weight: bold; }
        #topbar .sub { font-size: 12px; opacity: .85; margin-left: 16px; }
        #topbar .status { margin-left: auto; font-size: 12px; opacity: .9; }
        #main { display: flex; height: calc(100vh - 44px); }
        #editor-wrap { flex: 1; position: relative; }
        #placeholder { width: 100%; height: 100%; }
        #panel { width: 320px; background: #fff; border-left: 1px solid #e0e0e0; display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 12px 14px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 13px; background: #fafafa; }
        .panel-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
        .section-title { font-size: 12px; color: #534AB7; font-weight: bold; margin: 14px 0 8px; border-left: 3px solid #534AB7; padding-left: 8px; }
        .sheet-item { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin: 6px 0; cursor: pointer; font-size: 12px; transition: all .2s; }
        .sheet-item:hover { border-color: #534AB7; }
        .sheet-item.selected { background: #534AB7; color: #fff; border-color: #534AB7; }
        .sheet-item .name { font-weight: bold; }
        .sheet-item .meta { font-size: 11px; opacity: .7; margin-top: 3px; }
        .pos-item { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin: 6px 0; cursor: pointer; font-size: 12px; }
        .pos-item:hover { border-color: #534AB7; }
        .pos-item.selected { border: 2px solid #534AB7; background: #f0f0ff; }
        .btn { display: block; width: 100%; padding: 9px; margin-top: 10px; border: none; border-radius: 6px; background: #534AB7; color: #fff; font-size: 13px; cursor: pointer; }
        .btn:hover { background: #433A9A; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .bind-list { margin-top: 8px; }
        .bind-item { background: #f7f7fb; border: 1px solid #e0e0e0; border-radius: 5px; padding: 6px 8px; margin: 4px 0; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .bind-item .del { color: #d9534f; cursor: pointer; font-weight: bold; }
        .hint { font-size: 11px; color: #999; margin-top: 6px; line-height: 1.5; }
        .upload-row { margin: 4px 0; }
        .btn-upload { width: 100%; padding: 8px; border: 1px dashed #534AB7; border-radius: 6px; background: #f5f4ff; color: #534AB7; font-size: 12px; cursor: pointer; }
        .btn-upload:hover { background: #eceaff; }
        #renderMsg { font-size: 12px; margin-top: 8px; color: #2e7d32; }
    </style>
</head>
<body>
    <div id="topbar">
        <span class="title">银行函证制函演示</span>
        <span class="sub">Excel 直填模式 · OnlyOffice 模板编辑</span>
        <span class="status" id="status">加载中...</span>
    </div>
    <div id="main">
        <!-- 左侧：OnlyOffice 编辑器 -->
        <div id="editor-wrap">
            <div id="placeholder"></div>
        </div>
        <!-- 右侧：Sheet 绑定面板 -->
        <div id="panel">
            <div class="panel-header">📊 Excel 数据 与 模板绑定</div>
            <div class="panel-body">
                <div class="section-title">1. 选择 Excel Sheet</div>
                <div class="upload-row">
                    <input type="file" id="excelFile" accept=".xlsx,.xlsm" style="display:none" onchange="uploadExcel(this)">
                    <button class="btn-upload" onclick="document.getElementById('excelFile').click()">📁 上传 Excel（动态生成 Sheet 页签）</button>
                </div>
                <div id="excelInfo" class="hint"></div>
                <div id="sheetList"></div>

                <div class="section-title">2. 选择模板位置</div>
                <div id="posList"></div>

                <button class="btn" id="bindBtn" disabled onclick="addBinding()">＋ 绑定：Sheet → 模板位置</button>

                <div class="section-title">3. 已绑定列表</div>
                <div class="bind-list" id="bindList"></div>

                <button class="btn" id="renderBtn" onclick="render()">🚀 生成函证</button>
                <div id="renderMsg"></div>
                <div class="hint">说明：选择 Sheet 和模板位置后点击"绑定"，可将 Sheet 数据填充到模板表格中。此为演示 Demo，使用独立测试文档，不影响生产系统。</div>
            </div>
        </div>
    </div>

    <script>
        var docEditor = null;
        var ooEditor = null;      // OnlyOffice 真正的 editor 实例（用于原地 InsertText）
        var uniqueKey = 'demo-' + Date.now();
        var params = new URLSearchParams(window.location.search);
        var docUrl = params.get('doc') || 'http://192.168.100.92:8899/demo_template.docx';

        // ===== 动态数据（由后端接口返回，不再写死） =====
        var sheets = [];          // 用户上传 Excel 后动态生成：{name, header, row_count, preview}
        var positions = [];       // 位置列表：默认由上传 Excel 的 Sheet 数动态生成（位置数=Sheet数），格式 {idx, text}
        var excelPath = null;     // 后端保存的 Excel 路径

        var selSheet = null;
        var selPos = null;
        var binds = [];

        // ===== 初始化 OnlyOffice 编辑器 =====
        function initEditor() {
            if (typeof DocsAPI === 'undefined') {
                document.getElementById('status').textContent = 'api.js 加载失败';
                return;
            }
            try {
                docEditor = new DocsAPI.DocEditor("placeholder", {
                    document: {
                        fileType: "docx",
                        key: uniqueKey,
                        title: "银行询证函模板",
                        url: docUrl,
                        permissions: { download: true, print: true, edit: true }
                    },
                    documentType: "word",
                    width: "100%",
                    height: "100%",
                    editorConfig: {
                        mode: "edit",
                        lang: "zh-CN",
                        customization: { autosave: false, toolbar: true }
                    },
                    events: {
                        onAppReady: function() { setStatus('编辑器已就绪'); },
                        onDocumentReady: function(editor) {
                            // 捕获真正的 editor 实例，供原地 InsertText 使用
                            if (editor) ooEditor = editor;
                            setStatus('模板已加载 ✓');
                        },
                        onUpdateDocument: function(editor) {
                            // 兜底：部分版本仅在 onUpdateDocument 回调中提供 editor
                            if (editor && !ooEditor) ooEditor = editor;
                        },
                        onError: function(e) { setStatus('错误: ' + (e && e.errorDescription || '')); }
                    }
                });
            } catch (e) {
                document.getElementById('status').textContent = '初始化异常: ' + e.message;
            }
        }
        function setStatus(t) { document.getElementById('status').textContent = t; }

        // ===== 在 OnlyOffice 中直接插入标注文本（不刷新、不 destroy）=====
        // 利用 OnlyOffice editor 实例的 InsertText / paragraphInsertText API，
        // 在文档当前光标处写入「【Sheet「xxx」表格将在此处展示】」蓝色文字。
        function insertAnnoText(text) {
            if (!ooEditor) {
                setStatus('编辑器未就绪，请稍候重试');
                return false;
            }
            try {
                if (typeof ooEditor.InsertText === 'function') {
                    ooEditor.InsertText(text);
                } else if (typeof ooEditor.paragraphInsertText === 'function') {
                    ooEditor.paragraphInsertText({ Text: text, Type: 'text' });
                } else {
                    setStatus('当前 OnlyOffice 版本不支持原地插入文本');
                    return false;
                }
                return true;
            } catch (e) {
                setStatus('插入失败: ' + e.message);
                return false;
            }
        }

        // ===== 上传 Excel → 动态生成 Sheet 页签 =====
        function uploadExcel(input) {
            var file = input.files[0];
            if (!file) return;
            var fd = new FormData();
            fd.append('file', file);
            document.getElementById('excelInfo').textContent = '解析中...';
            fetch('/api/upload_excel', { method: 'POST', body: fd })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.error) { alert(d.error); return; }
                    excelPath = d.path;
                    sheets = d.sheets;
                    // 位置数 = Sheet 数：每个 Sheet 对应一个模板位置（位置序号 idx 与 Sheet 顺序一一对应）
                    positions = sheets.map(function(s, i) {
                        return { idx: i, text: '位置' + (i + 1) + '：' + s.name };
                    });
                    document.getElementById('excelInfo').textContent =
                        '已加载：' + sheets.length + ' 个 Sheet（' + file.name + '）';
                    renderSheets();
                    renderPositions();
                })
                .catch(function(e) { alert('上传失败: ' + e.message); });
        }

        // ===== 渲染 Sheet 列表 =====
        function renderSheets() {
            var box = document.getElementById('sheetList');
            if (!sheets.length) {
                box.innerHTML = '<div class="hint">尚未上传 Excel，请点击上方按钮上传</div>';
                return;
            }
            box.innerHTML = sheets.map(function(s, i) {
                return '<div class="sheet-item" onclick="selSheetFn(' + i + ')" id="sheet_' + i + '">' +
                    '<div class="name">📄 ' + s.name + '</div>' +
                    '<div class="meta">表头: ' + s.header.join(' · ') + ' | ' + s.row_count + ' 行数据</div>' +
                    '</div>';
            }).join('');
        }
        function selSheetFn(i) {
            selSheet = sheets[i];
            document.querySelectorAll('.sheet-item').forEach(function(el, idx) {
                el.classList.toggle('selected', idx === i);
            });
            updateBindBtn();
        }

        // ===== 渲染模板位置列表 =====
        // 优先：上传 Excel 后本地已按 Sheet 数生成 positions；
        // 兜底：若用户未上传 Excel，则从模板文档动态读取锚点（/api/template_anchors）。
        function loadPositions() {
            if (positions.length) { renderPositions(); return; }
            fetch('/api/template_anchors')
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.error) { alert(d.error); return; }
                    positions = d.anchors;
                    renderPositions();
                })
                .catch(function(e) { alert('读取模板位置失败: ' + e.message); });
        }
        function renderPositions() {
            var box = document.getElementById('posList');
            if (!positions.length) {
                box.innerHTML = '<div class="hint">未在模板中发现占位锚点</div>';
                return;
            }
            box.innerHTML = positions.map(function(p, i) {
                return '<div class="pos-item" onclick="selPosFn(' + i + ')" id="pos_' + i + '">' +
                    '📍 ' + (p.text || ('位置' + p.idx)) + '</div>';
            }).join('');
        }
        function selPosFn(i) {
            selPos = positions[i];
            document.querySelectorAll('.pos-item').forEach(function(el, idx) {
                el.classList.toggle('selected', idx === i);
            });
            updateBindBtn();
        }

        // ===== 绑定 =====
        function updateBindBtn() {
            document.getElementById('bindBtn').disabled = !(selSheet && selPos);
        }
        function addBinding() {
            if (!selSheet || !selPos) return;
            // 避免重复绑定同一位置（按 pos_index 判断）
            if (binds.some(function(b) { return b.posIndex === selPos.idx; })) {
                alert('该位置已绑定，请选择其他位置或删除原绑定');
                return;
            }
            binds.push({
                sheet: selSheet.name,
                posIndex: selPos.idx,
                posLabel: selPos.text || ('位置' + (selPos.idx + 1))
            });
            renderBindList();
            // 绑定后立即回写到模板，让左侧 OnlyOffice 实时显示 📌 标注
            annotateToEditor();
        }
        function removeBinding(i) {
            binds.splice(i, 1);
            renderBindList();
            annotateToEditor();
        }
        function renderBindList() {
            var box = document.getElementById('bindList');
            box.innerHTML = binds.map(function(b, i) {
                return '<div class="bind-item"><span>📄 ' + b.sheet + ' → ' + b.posLabel + '</span><span class="del" onclick="removeBinding(' + i + ')">✕</span></div>';
            }).join('');
        }

        // 将当前绑定关系直接在 OnlyOffice 编辑器内插入标注文本（不刷新、不 destroy）
        function annotateToEditor() {
            if (!binds.length) {
                setStatus('请先添加绑定');
                return;
            }
            if (!ooEditor) {
                setStatus('编辑器未就绪，请稍候重试');
                return;
            }
            setStatus('正在插入标注...');
            var ok = true;
            // 在每个绑定后插入一行标注文本
            binds.forEach(function(b) {
                var text = '\n【Sheet「' + b.sheet + '」表格将在此处展示】\n';
                if (!insertAnnoText(text)) ok = false;
            });
            if (ok) setStatus('标注已插入 ✓ 共 ' + binds.length + ' 处');
        }

        // ===== 渲染 =====
        function render() {
            var msg = document.getElementById('renderMsg');
            if (!binds.length) { alert('请先添加至少一个绑定'); return; }
            if (!excelPath) { alert('请先上传 Excel'); return; }
            msg.textContent = '生成中...';
            // 正式对接后端渲染：把绑定 + 模板 + Excel 发到 /api/render
            fetch('/api/render', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tpl_path: null,
                    excel_path: excelPath,
                    bindings: binds.map(function(b) { return { pos_index: b.posIndex, anchor_mode: 'after_para', sheet_name: b.sheet, pos_label: b.posLabel }; })
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.error) { msg.textContent = '✗ ' + d.error; return; }
                msg.innerHTML = '✅ 已生成函证：<a href="' + d.download_url + '" target="_blank">下载 docx</a>';
            })
            .catch(function(e) { msg.textContent = '✗ 生成失败: ' + e.message; });
        }

        // 初始化
        renderSheets();          // 显示"尚未上传"提示
        loadPositions();          // 动态加载模板位置锚点
        if (typeof DocsAPI !== 'undefined') {
            initEditor();
        } else {
            window.addEventListener('load', function() { setTimeout(initEditor, 1000); });
        }
    </script>
</body>
</html>
