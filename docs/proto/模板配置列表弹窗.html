<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>模板配置列表（弹窗）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  body { background:#eef0f6; display:flex; align-items:center; justify-content:center; height:100vh; }

  /* 遮罩 */
  .overlay { position:fixed; inset:0; background:rgba(31,45,90,.45); display:flex; align-items:center; justify-content:center; z-index:20; }

  .modal { width:780px; background:#fff; border-radius:10px; box-shadow:0 12px 48px rgba(31,45,90,.25); overflow:hidden; }

  .modal-head { background:#6083F0; color:#fff; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; }
  .modal-head .t { font-size:16px; font-weight:bold; }
  .modal-head .x { cursor:pointer; color:#dbe4ff; font-size:20px; }

  .modal-body { padding:20px 22px; }

  .head-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .head-row .hint { font-size:12px; color:#8a8fa3; }
  .btn-new { background:#6083F0; color:#fff; border:none; padding:9px 20px; border-radius:6px; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn-new:hover { background:#4a6cf7; }

  table { width:100%; border-collapse:collapse; }
  th { background:#f4f7ff; color:#5a6072; font-size:12px; text-align:left; padding:11px 14px; font-weight:600; }
  td { padding:13px 14px; font-size:13px; color:#2a2f3e; border-top:1px solid #eef0f6; }

  .tpl-name { font-weight:bold; color:#1f2d5a; display:flex; align-items:center; gap:8px; }
  .v { background:#e9effd; color:#6083F0; font-size:11px; padding:2px 7px; border-radius:8px; }

  .bind-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:#f0f2f9; color:#4a4f5e; font-size:12px; padding:3px 10px; border-radius:12px; }

  .op { display:flex; gap:8px; }
  .op .edit { background:#e9effd; color:#6083F0; border:none; padding:6px 14px; border-radius:6px; font-size:13px; cursor:pointer; font-weight:bold; }
  .op .del { background:#fdecec; color:#d63031; border:none; padding:6px 14px; border-radius:6px; font-size:13px; cursor:pointer; }

  .modal-foot { padding:14px 22px; border-top:1px solid #eef0f6; display:flex; justify-content:flex-end; }
  .btn { padding:9px 26px; border-radius:6px; font-size:14px; cursor:pointer; }
  .btn-default { background:#fff; color:#5a6072; border:1px solid #d4d8e4; }

  .tip { margin-top:14px; background:#f4f7ff; border-left:3px solid #6083F0; padding:10px 14px; border-radius:4px; font-size:12px; color:#5a6072; line-height:1.7; }
</style>
</head>
<body>

<div class="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="t">🧩 模板配置</div>
      <div class="x">✕</div>
    </div>

    <div class="modal-body">
      <div class="head-row">
        <div class="hint">共 3 个模板 · 每个模板 = 一份 Word + 绑定的 Sheet 位置</div>
        <button class="btn-new">+ 新建模板</button>
      </div>

      <table>
        <thead>
          <tr><th style="width:26%">模板名称</th><th>绑定的 Sheet（按位置顺序）</th><th style="width:14%">更新时间</th><th style="width:20%">操作</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="tpl-name">银行询证函-销售采购 <span class="v">v2</span></span></td>
            <td><span class="bind-chips"><span class="chip">销售明细</span><span class="chip">其他往来</span></span></td>
            <td>2026-08-24 09:50</td>
            <td><div class="op"><button class="edit">修改模板</button><button class="del">删除</button></div></td>
          </tr>
          <tr>
            <td><span class="tpl-name">银行询证函-全科目 <span class="v">v1</span></span></td>
            <td><span class="bind-chips"><span class="chip">销售明细</span><span class="chip">采购明细</span><span class="chip">往来款项</span><span class="chip">银行账户</span></span></td>
            <td>2026-08-23 16:20</td>
            <td><div class="op"><button class="edit">修改模板</button><button class="del">删除</button></div></td>
          </tr>
          <tr>
            <td><span class="tpl-name">验资询证函 <span class="v">v1</span></span></td>
            <td><span class="bind-chips"><span class="chip">验资明细</span></span></td>
            <td>2026-08-22 11:05</td>
            <td><div class="op"><button class="edit">修改模板</button><button class="del">删除</button></div></td>
          </tr>
        </tbody>
      </table>

      <div class="tip">
        💡 点击「<strong>修改模板</strong>」进入 OnlyOffice 编辑页，编辑该模板的占位符位置；<br>
        点击「<strong>新建模板</strong>」基于默认模板创建新模板。
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-default">关闭</button>
    </div>
  </div>
</div>

</body>
</html>
